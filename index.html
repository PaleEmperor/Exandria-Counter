<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dawn of the D&D Campaign</title>
<style>
:root{
  --grade-sat: 1.05;
  --grade-bright: .91;
  --grade-contrast: 1.08;
  --bloom: 1;
  --party-opacity: .55;
  --title-cream: #eee2c8;
  --accent: #d44a38;
  --accent2: #ff7a45;
  --gold: #e3a254;
  --panel: rgba(9,6,9,.58);
  --ember: #ff9a48;
  --mouse-x: 50%;
  --mouse-y: 50%;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08060a;color:white}
body{display:grid;place-items:center;font-family:Georgia,"Times New Roman",serif}

#frame{
  position:relative;
  width:min(100vw,calc(100vh * 1.5));
  height:min(100vh,calc(100vw / 1.5));
  aspect-ratio:3/2;
  overflow:hidden;
  background:#120a11;
  isolation:isolate;
  cursor:default;
}
.layer{position:absolute;inset:0;pointer-events:none}

#scene{
  width:106%;height:106%;left:-3%;top:-3%;object-fit:cover;
  filter:saturate(var(--grade-sat)) brightness(var(--grade-bright)) contrast(var(--grade-contrast));
  transform:translate(calc((var(--px,0) * -7px)),calc((var(--py,0) * -4px))) scale(1.02);
  transition:filter .7s ease;
  animation:sceneDrift 18s ease-in-out infinite alternate;
}

/* The adventuring party appears as a vast, half-remembered vision in the clouds. */
#partyGroup{
  position:absolute;
  left:-4%;top:12%;
  width:108%;aspect-ratio:2172/724;
  transform:scale(1.02);
}
.party-art{
  position:absolute;inset:0;
  width:100%;height:100%;object-fit:contain;
  mix-blend-mode:normal;
  -webkit-mask-image:linear-gradient(to bottom,#000 0 56%,rgba(0,0,0,.82) 70%,rgba(0,0,0,.28) 88%,transparent 100%);
  mask-image:linear-gradient(to bottom,#000 0 56%,rgba(0,0,0,.82) 70%,rgba(0,0,0,.28) 88%,transparent 100%);
}
#party{
  opacity:var(--party-opacity);
  filter:saturate(.78) brightness(1.08) contrast(1.04) sepia(.08)
    drop-shadow(0 0 14px rgba(255,82,46,.46))
    drop-shadow(0 0 34px rgba(124,58,112,.38));
  transition:opacity .32s ease,filter .32s ease;
  animation:partyIn 2.2s ease-out both;
}
.party-focus{
  z-index:1;opacity:0;
  filter:saturate(1.08) brightness(1.22) contrast(1.07)
    drop-shadow(0 0 9px rgba(255,213,116,.55))
    drop-shadow(0 0 24px rgba(255,80,42,.32));
  transition:opacity .28s ease;
}
.character-hit{position:absolute;inset:0;z-index:2}
.hit-warrior,.focus-warrior{clip-path:polygon(0 100%,1% 78%,7% 62%,10% 38%,13% 20%,16% 27%,18% 11%,22% 9%,26% 15%,28% 29%,32% 51%,31% 73%,30% 100%)}
.hit-knight,.focus-knight{clip-path:polygon(23% 100%,24% 78%,27% 62%,28% 41%,31% 29%,34% 20%,35% 13%,38% 16%,41% 27%,45% 38%,49% 50%,52% 69%,54% 100%)}
.hit-druid,.focus-druid{clip-path:polygon(42% 100%,43% 73%,45% 56%,46% 38%,49% 22%,51% 8%,57% 4%,61% 8%,64% 19%,67% 31%,69% 50%,72% 72%,74% 100%)}
.hit-ranger,.focus-ranger{clip-path:polygon(65% 100%,67% 77%,68% 58%,69% 43%,71% 32%,74% 26%,77% 27%,79% 34%,81% 46%,83% 61%,85% 79%,86% 100%)}
.hit-bard,.focus-bard{clip-path:polygon(79% 100%,81% 79%,82% 62%,84% 53%,83% 43%,86% 36%,89% 39%,92% 47%,95% 55%,100% 62%,100% 100%)}
#partyGroup:hover #party{opacity:calc(var(--party-opacity) * .62);filter:saturate(.5) brightness(.82) contrast(1.04)}
.character-hit:hover + .party-focus{opacity:.96}

/* Cold moon halo, warm dawn glow, and localized architectural light. */
#lighting{
  background:
    radial-gradient(circle at 66% 10%,rgba(184,89,126,calc(.23 * var(--bloom))) 0 5%,rgba(84,41,83,.11) 14%,transparent 28%),
    radial-gradient(circle at 49% 69%,rgba(255,128,38,calc(.56 * var(--bloom))) 0 4%,rgba(249,62,24,.21) 12%,transparent 29%),
    radial-gradient(ellipse at 72% 59%,rgba(255,181,71,calc(.10 * var(--bloom))) 0 7%,transparent 24%),
    radial-gradient(circle at var(--mouse-x) var(--mouse-y),rgba(255,205,126,.08),transparent 16%);
  mix-blend-mode:screen;
  animation:lightBreath 5.8s ease-in-out infinite alternate;
}
#shade{
  background:
    linear-gradient(to bottom,rgba(21,9,30,.12),transparent 34%,transparent 67%,rgba(4,2,4,.36)),
    linear-gradient(90deg,rgba(0,0,0,.22),transparent 16%,transparent 84%,rgba(0,0,0,.21));
  mix-blend-mode:multiply;
}
#redWash{
  background:linear-gradient(180deg,rgba(86,18,47,.10),rgba(221,46,30,.05) 48%,rgba(254,105,25,.04));
  mix-blend-mode:color;
}
#mist{
  inset:auto -10% -7% -10%;
  height:37%;
  background:
    radial-gradient(ellipse at 16% 70%,rgba(198,146,130,.12),transparent 28%),
    radial-gradient(ellipse at 45% 77%,rgba(194,145,149,.09),transparent 33%),
    radial-gradient(ellipse at 78% 72%,rgba(167,125,145,.10),transparent 29%);
  filter:blur(22px);
  animation:mist 17s ease-in-out infinite alternate;
}

/* Volumetric sunrise rays and a restrained river reflection add depth without obscuring the art. */
#rays{
  inset:38% 17% auto 22%;
  height:54%;
  background:conic-gradient(from 257deg at 50% 0,transparent 0 4deg,rgba(255,114,32,.095) 5deg 7deg,transparent 8deg 14deg,rgba(255,178,72,.07) 15deg 17deg,transparent 18deg 25deg,rgba(255,102,26,.055) 26deg 28deg,transparent 29deg);
  filter:blur(7px);
  mix-blend-mode:screen;
  transform-origin:50% 0;
  animation:rays 8s ease-in-out infinite alternate;
}
#riverLight{
  left:36%;top:77%;width:26%;height:23%;
  background:linear-gradient(105deg,transparent 16%,rgba(255,121,35,.08) 35%,rgba(255,197,94,.24) 51%,rgba(255,91,24,.07) 66%,transparent 82%);
  clip-path:polygon(42% 0,60% 0,100% 100%,0 100%);
  filter:blur(10px);
  mix-blend-mode:screen;
  animation:riverShimmer 4.6s ease-in-out infinite alternate;
}

/* The two skull eyes are part of the artwork; these halos make them feel alive. */
.eye{
  position:absolute;border-radius:50%;mix-blend-mode:screen;
  background:radial-gradient(circle,
    transparent 0 17%,
    rgba(255,246,178,.14) 19%,
    rgba(255,226,92,.88) 28%,
    rgba(255,190,46,.46) 40%,
    rgba(255,213,84,.14) 56%,
    transparent 72%);
  filter:blur(.65px);
  animation:eyePulse 3.4s ease-in-out infinite;
}
.eye-left{left:62.3%;top:24%;width:7.2%;aspect-ratio:1}
.eye-right{left:77.3%;top:16.5%;width:7%;aspect-ratio:1;animation-delay:-1.15s}

/* A soft lantern pulse over the clock tower's rose window preserves its stone tracery. */
#clockGlow{
  position:absolute;left:83.55%;top:46%;width:6.35%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,
    rgba(255,240,153,.24) 0 24%,
    rgba(255,195,65,.18) 38%,
    rgba(255,139,34,.08) 57%,
    transparent 74%);
  box-shadow:0 0 10px rgba(255,183,58,.18),0 0 24px rgba(255,116,29,.1);
  filter:blur(1.4px);
  mix-blend-mode:screen;
  animation:clockPulse 4.8s ease-in-out infinite;
}

/* More localized sources along the town and river. */
.glow{position:absolute;border-radius:50%;filter:blur(10px);mix-blend-mode:screen;pointer-events:none}
.g1{left:43%;top:66%;width:10%;height:8%;background:rgba(255,125,37,.22);animation:flicker 3.9s infinite}
.g2{left:70%;top:69%;width:9%;height:8%;background:rgba(255,166,56,.16);animation:flicker 4.7s .8s infinite}
.g3{left:83%;top:73%;width:10%;height:9%;background:rgba(255,156,45,.15);animation:flicker 3.2s 1.3s infinite}
.g4{left:2%;top:45%;width:8%;height:17%;background:rgba(255,126,38,.14);animation:flicker 5.1s .4s infinite}

/* Title card — no heavy box, just the faint dark veil from the reference. */
#veil{
  position:absolute;
  left:20%;top:45%;
  width:60%;height:38%;
  background:
    radial-gradient(ellipse at center,rgba(6,4,6,.46),rgba(6,4,6,.24) 55%,rgba(6,4,6,.06) 78%,transparent 100%);
  filter:blur(5px);
}
#crest{
  position:absolute;left:50%;top:47%;width:clamp(150px,19%,330px);aspect-ratio:1;
  transform:translateX(-50%);opacity:.095;
  filter:sepia(1) saturate(1.8) drop-shadow(0 0 18px rgba(255,111,55,.72));
  animation:crestTurn 42s linear infinite;
}
#title{
  position:absolute;
  left:19%;top:46%;
  width:62%;
  text-align:center;
  filter:drop-shadow(0 5px 4px rgba(0,0,0,.78));
  transform:translate(calc(var(--px,0) * 1.2px),calc(var(--py,0) * .7px));
}
.kicker{
  font-weight:800;
  font-size:clamp(25px,3.3vw,62px);
  color:var(--title-cream);
  letter-spacing:.02em;
  text-shadow:0 2px 0 #1d1010,0 0 12px rgba(0,0,0,.88),0 0 24px rgba(255,117,56,.13);
  animation:titleIn 1.1s ease both;
}
.dayline{
  display:flex;align-items:baseline;justify-content:center;
  gap:.025em;margin-top:-.02em;white-space:nowrap;
  line-height:.86;font-weight:900;
  animation:titleIn 1.35s .08s ease both;
}
.number{
  font-size:clamp(70px,10vw,185px);
  letter-spacing:-.07em;
  background:linear-gradient(#f46b4b 0%,#c93631 43%,#762322 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:none;
  filter:drop-shadow(0 5px 0 #250d0d) drop-shadow(0 0 8px rgba(0,0,0,.8)) drop-shadow(0 0 14px rgba(255,70,43,.25));
  animation:numberGlow 3.8s ease-in-out infinite alternate;
}
.suffix{
  font-size:clamp(26px,4.4vw,78px);
  color:var(--title-cream);
  transform:translateY(-.29em);
  display:inline-block;
  margin-left:-.03em;
  text-shadow:0 3px 0 #180d0d;
}
.dayword{
  font-size:clamp(64px,8.5vw,154px);
  color:var(--title-cream);
  letter-spacing:-.055em;
  margin-left:.035em;
  text-shadow:0 4px 0 #1d1010,0 0 10px rgba(0,0,0,.85);
}
#remain{
  margin-top:1.1%;
  font-size:clamp(20px,2.65vw,50px);
  color:#f0a46c;
  letter-spacing:.03em;
  font-weight:700;
  text-shadow:0 2px 0 #130b0b,0 0 10px rgba(0,0,0,.9);
  animation:titleIn 1.1s .45s ease both;
}
#sub{
  position:absolute;left:0;right:0;bottom:6.2%;
  text-align:center;
  font-size:clamp(16px,1.65vw,30px);
  color:#e9dcc7;
  letter-spacing:.035em;
  text-shadow:0 2px 0 #000,0 0 10px #000;
  opacity:.92;
}
#sub span{padding:.2em .65em;background:rgba(0,0,0,.28)}
#sub span{background:linear-gradient(90deg,transparent,rgba(0,0,0,.24),transparent)}

/* Screen treatment */
#grain{
  opacity:.022;
  background-image:
    radial-gradient(circle at 10% 20%,rgba(255,255,255,.8) 0 .45px,transparent .6px),
    radial-gradient(circle at 80% 70%,rgba(255,255,255,.6) 0 .45px,transparent .6px);
  background-size:11px 11px,17px 17px;
  animation:grain .45s steps(2) infinite;
  mix-blend-mode:overlay;
}
#scan{
  opacity:.035;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.045) 0,rgba(255,255,255,.045) 1px,rgba(0,0,0,.08) 2px,rgba(0,0,0,.08) 4px);
  mix-blend-mode:overlay;
}
#vignette{box-shadow:inset 0 0 8vmin rgba(0,0,0,.17),inset 0 0 24vmin rgba(0,0,0,.55)}

/* Tiny control drawer; hidden by default. */
#controls{
  position:absolute;right:16px;top:16px;z-index:20;
  display:flex;gap:7px;align-items:center;
  padding:7px;
  border:1px solid rgba(255,255,255,.11);
  border-radius:999px;
  background:rgba(14,8,15,.48);
  backdrop-filter:blur(12px);
  opacity:.32;
  transition:opacity .25s ease;
  font:600 11px/1.2 Arial,sans-serif;
}
#controls:hover{opacity:1}
#controls button{
  border:1px solid rgba(255,255,255,.12);
  color:#ddd1c8;background:rgba(255,255,255,.035);
  border-radius:999px;padding:6px 10px;cursor:pointer;
}
#controls button:hover{background:rgba(255,255,255,.09)}
#controls button.active{border-color:rgba(242,117,71,.55);color:white}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}

@keyframes partyIn{from{opacity:0;filter:blur(8px) saturate(.4) brightness(.65)}to{opacity:var(--party-opacity)}}
@keyframes sceneDrift{from{scale:1.005}to{scale:1.018}}
@keyframes lightBreath{from{opacity:.84}to{opacity:1}}
@keyframes mist{from{transform:translateX(-2%)}to{transform:translateX(2.5%)}}
@keyframes rays{from{opacity:.54;transform:rotate(-1deg) scaleX(.96)}to{opacity:1;transform:rotate(1.2deg) scaleX(1.04)}}
@keyframes riverShimmer{from{opacity:.48;transform:translateX(-2%) scaleX(.92)}to{opacity:.94;transform:translateX(2%) scaleX(1.08)}}
@keyframes eyePulse{0%,100%{opacity:.55;transform:scale(.92)}45%{opacity:.96;transform:scale(1.1)}52%{opacity:.66}62%{opacity:.92}}
@keyframes clockPulse{0%,100%{opacity:.48;transform:scale(.97)}38%{opacity:.78;transform:scale(1.025)}43%{opacity:.61}68%{opacity:.72}}
@keyframes crestTurn{to{transform:translateX(-50%) rotate(360deg)}}
@keyframes numberGlow{from{filter:drop-shadow(0 5px 0 #250d0d) drop-shadow(0 0 8px rgba(0,0,0,.8)) drop-shadow(0 0 8px rgba(255,70,43,.16))}to{filter:drop-shadow(0 5px 0 #250d0d) drop-shadow(0 0 8px rgba(0,0,0,.8)) drop-shadow(0 0 21px rgba(255,82,43,.42))}}
@keyframes flicker{0%,100%{opacity:.62;transform:scale(1)}20%{opacity:.93}24%{opacity:.55}48%{opacity:.78}77%{opacity:.51;transform:scale(1.06)}}
@keyframes grain{from{transform:translate(0,0)}to{transform:translate(1px,-1px)}}
@keyframes titleIn{from{opacity:0;transform:scale(.97);filter:blur(2px)}to{opacity:1;transform:none;filter:blur(0)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media (max-width:700px){
  #controls{right:8px;top:8px;padding:5px;gap:3px}
  #controls button{font-size:9px;padding:5px 7px}
}
</style>
</head>
<body>
<div id="frame" data-campaign-start="2026-10-16T19:00:00+02:00">
  <img id="scene" class="layer" src="assets/scene.png" alt="">
  <div id="partyGroup">
    <img id="party" class="party-art" src="assets/party.png" alt="The adventuring party watching over the horizon">
    <span class="character-hit hit-warrior"></span><img class="party-art party-focus focus-warrior" src="assets/party.png" alt="" aria-hidden="true">
    <span class="character-hit hit-knight"></span><img class="party-art party-focus focus-knight" src="assets/party.png" alt="" aria-hidden="true">
    <span class="character-hit hit-druid"></span><img class="party-art party-focus focus-druid" src="assets/party.png" alt="" aria-hidden="true">
    <span class="character-hit hit-ranger"></span><img class="party-art party-focus focus-ranger" src="assets/party.png" alt="" aria-hidden="true">
    <span class="character-hit hit-bard"></span><img class="party-art party-focus focus-bard" src="assets/party.png" alt="" aria-hidden="true">
  </div>

  <div id="redWash" class="layer"></div>
  <div id="rays" class="layer"></div>
  <div id="riverLight" class="layer"></div>
  <div id="lighting" class="layer"></div>
  <div id="mist" class="layer"></div>
  <div class="eye eye-left"></div><div class="eye eye-right"></div>
  <div id="clockGlow"></div>
  <div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div><div class="glow g4"></div>
  <div id="shade" class="layer"></div>

  <div id="veil"></div>
  <img id="crest" src="assets/d20.svg" alt="">
  <div id="title">
    <div class="kicker">DAWN OF THE</div>
    <div class="dayline">
      <span class="number" id="dayNum">--</span>
      <span class="suffix" id="suffix"></span>
      <span class="dayword">DAY</span>
    </div>
    <div id="remain">Calculating time remaining…</div>
  </div>
  <div id="sub"><span>Until the D&amp;D campaign starts…</span></div>

  <canvas id="particles"></canvas>
  <div id="grain" class="layer"></div>
  <div id="scan" class="layer"></div>
  <div id="vignette" class="layer"></div>

  <div id="controls">
    <button data-preset="reference" class="active">Reference</button>
    <button data-preset="blood">Blood Moon</button>
    <button data-preset="ember">Ember</button>
    <button data-preset="dream">Dream</button>
  </div>
</div>

<script>
(() => {
  const root = document.documentElement;
  const frame = document.getElementById("frame");
  // Read the campaign date from the page and derive every displayed value live.
  const TARGET = new Date(frame.dataset.campaignStart);
  const DAY = 86400000;
  const dayNum = document.getElementById("dayNum");
  const suffix = document.getElementById("suffix");
  const remain = document.getElementById("remain");

  function ordinal(n){
    const m=n%100;
    if(m>=11&&m<=13)return "th";
    return n%10===1?"st":n%10===2?"nd":n%10===3?"rd":"th";
  }
  function update(){
    let diff = TARGET - new Date();
    if(diff <= 0){
      dayNum.textContent = "0";
      suffix.textContent = "th";
      remain.textContent = "– Roll for initiative –";
      return;
    }
    const memeDay = Math.ceil(diff / DAY) + 1;
    dayNum.textContent = memeDay;
    suffix.textContent = ordinal(memeDay);

    const sec = Math.floor(diff/1000);
    const d = Math.floor(sec/86400);
    const h = Math.floor((sec%86400)/3600);
    const m = Math.floor((sec%3600)/60);
    const s = sec%60;
    remain.textContent = `– ${d}d ${String(h).padStart(2,"0")}h ${String(m).padStart(2,"0")}m ${String(s).padStart(2,"0")}s Remain –`;
  }
  update();
  setInterval(update,250);

  // Mouse parallax + subtle interactive light.
  frame.addEventListener("pointermove", e => {
    const r = frame.getBoundingClientRect();
    const x = (e.clientX-r.left)/r.width;
    const y = (e.clientY-r.top)/r.height;
    root.style.setProperty("--px", (x-.5).toFixed(3));
    root.style.setProperty("--py", (y-.5).toFixed(3));
    root.style.setProperty("--mouse-x", `${(x*100).toFixed(1)}%`);
    root.style.setProperty("--mouse-y", `${(y*100).toFixed(1)}%`);
  });

  // Style presets.
  const presets = {
    reference: {"--grade-sat":"1.05","--grade-bright":".91","--grade-contrast":"1.08","--bloom":"1"},
    blood:     {"--grade-sat":"1.28","--grade-bright":".82","--grade-contrast":"1.17","--bloom":"1.22"},
    ember:     {"--grade-sat":"1.16","--grade-bright":".98","--grade-contrast":"1.07","--bloom":"1.28"},
    dream:     {"--grade-sat":".86","--grade-bright":"1.03","--grade-contrast":".94","--bloom":".86"}
  };
  document.querySelectorAll("[data-preset]").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll("[data-preset]").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    Object.entries(presets[b.dataset.preset]).forEach(([k,v])=>root.style.setProperty(k,v));
  }));

  frame.addEventListener("dblclick", async () => {
    try{
      if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    }catch(_){}
  });

  // Ember/dust particles. They brighten near the sunrise and stay understated elsewhere.
  const c = document.getElementById("particles");
  const ctx = c.getContext("2d");
  let W=0,H=0,DPR=1,parts=[];
  function resize(){
    const r=frame.getBoundingClientRect();
    DPR=Math.min(2,window.devicePixelRatio||1);
    W=Math.round(r.width*DPR); H=Math.round(r.height*DPR);
    c.width=W;c.height=H;
    parts=Array.from({length:34},()=>({
      x:Math.random()*W,y:(.48+Math.random()*.52)*H,
      r:(.55+Math.random()*1.15)*DPR,
      vx:(-.08+Math.random()*.16)*DPR,
      vy:(-.08-Math.random()*.15)*DPR,
      a:.12+Math.random()*.30,
      pulse:Math.random()*Math.PI*2
    }));
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    for(const p of parts){
      p.x+=p.vx;p.y+=p.vy;p.pulse+=.025;
      if(p.y<H*.45){p.y=H+10;p.x=Math.random()*W}
      if(p.x<-10)p.x=W+10;if(p.x>W+10)p.x=-10;
      const alpha=p.a*(.72+Math.sin(p.pulse)*.28);
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.shadowBlur=7*DPR;ctx.shadowColor=`rgba(255,105,38,${alpha})`;
      ctx.fillStyle=`rgba(255,170,83,${alpha})`;
      ctx.fill();
    }
    ctx.shadowBlur=0;
    requestAnimationFrame(draw);
  }
  addEventListener("resize",resize);resize();draw();
})();
</script>
</body>
</html>
